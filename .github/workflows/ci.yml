name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=verbose

  test-windows:
    name: Test (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release workflow runs the suite on Windows, so a POSIX-only
      # assumption has to fail here instead of after a tag is pushed.
      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Verify both supported macOS architectures on arm64 and x64 respectively.
        # macos-14 is retired (2026-11-02) and its jobs were cancelled before running a
        # single step, so the arm64 data point now comes from macos-15.
        # Keep Windows pinned until node-gyp supports VS2026.
        os: [macos-15, macos-15-intel, ubuntu-latest, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Launch smoke on one platform: the built app must boot headless and stay
      # alive through the script's liveness window. xvfb is preinstalled on
      # Ubuntu runners; ELECTRON_DISABLE_SANDBOX covers the SUID sandbox gap.
      - name: Electron launch smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/smoke-electron.mjs
        env:
          ELECTRON_DISABLE_SANDBOX: '1'

      # The Phase 8 cutover gate requires the durable runtime's own e2e witness to run
      # automatically rather than by manual dispatch. It rides this leg because the app is
      # already built here and xvfb is the same recipe the smoke above uses. Only the
      # shell-turn spec is automated: it needs no model and no secret. The prompt-turn spec
      # needs a model key and the developer's own models.json, so it stays a manual
      # pre-release check (see ROADMAP Phase 8, item 8).
      - name: Durable runtime e2e (Linux)
        if: matrix.os == 'ubuntu-latest'
        # The exit code cannot distinguish "the gate ran" from "the gate skipped itself", because a
        # suite where everything skips still exits 0. So the run writes a JSON report and the next
        # line requires the facts a real run produces. See scripts/assertGateRan.mjs.
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=durable-gate.json \
            xvfb-run --auto-servernum npx playwright test \
              tests/e2e/durableGate.spec.ts --reporter=json
          node scripts/assertGateRan.mjs durable-gate.json
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          OPENPI_E2E_DURABLE: '1'

      - name: Upload Playwright traces on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-durable-gate
          path: |
            test-results/
            durable-gate.json
          retention-days: 7
