name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=verbose

  test-windows:
    name: Test (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release workflow runs the suite on Windows, so a POSIX-only
      # assumption has to fail here instead of after a tag is pushed.
      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Verify both supported macOS architectures. macos-14 is Apple silicon;
        # macos-15-intel is Intel. Keep Windows pinned until node-gyp supports VS2026.
        os: [macos-14, macos-15-intel, ubuntu-latest, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Launch smoke on one platform: the built app must boot headless and stay
      # alive through the script's liveness window. xvfb is preinstalled on
      # Ubuntu runners; ELECTRON_DISABLE_SANDBOX covers the SUID sandbox gap.
      - name: Electron launch smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/smoke-electron.mjs
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
