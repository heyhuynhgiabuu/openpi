name: Beta Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build native modules on their target architecture. Cross-compiling would
          # leave better-sqlite3 and optional native dependencies at the host ABI.
          - name: macOS ARM64
            os: macos-14
            arch: arm64
            artifactArch: arm64
            extensions: "dmg zip"
          - name: macOS Intel
            os: macos-15-intel
            arch: x64
            artifactArch: x64
            extensions: "dmg zip"
          - name: Windows
            # Pinned to windows-2022 (VS2022): windows-latest is being redirected to
            # windows-2025-vs2026 (VS2026) which node-gyp ≤12.3 does not recognise,
            # causing electron-builder's internal npmRebuild to fail on better-sqlite3.
            # Revisit when node-gyp ships VS2026 support (upstream PR #3240).
            os: windows-2022
            arch: x64
            artifactArch: x64
            extensions: "exe"
          - name: Linux
            os: ubuntu-latest
            arch: x64
            # electron-builder uses the Linux convention in generated artifact names.
            artifactArch: x86_64
            extensions: "AppImage"
    env:
      # Signing and notarization are enabled when the Apple/Windows secrets are configured.
      # Public beta builds run unsigned when the secrets are absent.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OPENPI_RELEASE_CHANNEL: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release version
        id: release_meta
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          ROOT_LOCK_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ] || [ "$VERSION" != "$LOCK_VERSION" ] || [ "$VERSION" != "$ROOT_LOCK_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match package metadata ($PACKAGE_VERSION, $LOCK_VERSION, $ROOT_LOCK_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          # electron-builder downloads NSIS, 7zip, and other tools to a platform cache dir.
          # Caching prevents re-downloads on every run and avoids transient network failures.
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Package installers
        # Unsigned beta build. To enable macOS notarization, add repository secrets:
        # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, CSC_LINK (base64 .p12),
        # CSC_KEY_PASSWORD — and replace this step with a conditional signing env block.
        # Do NOT pass CSC_LINK/APPLE_ID as empty env vars: electron-builder treats any
        # non-unset CSC_LINK as "certificate configured" and fails signing on empty values.
        run: npx electron-builder --config electron-builder.json --${{ matrix.arch }} --publish never

      - name: Verify packaged artifacts (minimum size checks)
        shell: bash
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          RELEASE_DIR="release/${VERSION}"

          echo "=== Verifying packaged artifacts in $RELEASE_DIR ==="

          MIN_BYTES=1048576  # 1 MB minimum — guards against empty/truncated output

          for ext in ${{ matrix.extensions }}; do
            artifact="$RELEASE_DIR/OpenPi-$VERSION-${{ matrix.artifactArch }}.$ext"
            if [ ! -f "$artifact" ]; then
              echo "::error::Missing required release artifact: $artifact"
              exit 1
            fi
            size=$(wc -c < "$artifact")
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "::error::$artifact is only ${size} bytes (expected >= ${MIN_BYTES})"
              exit 1
            fi
            echo "OK: $artifact (${size} bytes)"
          done

          echo "All required artifacts passed minimum-size verification."

      - name: Verify macOS package architecture
        if: ${{ startsWith(matrix.name, 'macOS') }}
        shell: bash
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          node scripts/verifyMacPackage.mjs "$VERSION" "${{ matrix.arch }}"

      - name: Remove per-architecture macOS update metadata
        if: ${{ startsWith(matrix.name, 'macOS') }}
        shell: bash
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          rm -f "release/$VERSION/latest-mac.yml"

      - name: Generate per-platform checksums
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          RELEASE_DIR="release/${VERSION}"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "No release directory found — nothing to checksum."
            exit 0
          fi

          CHECKSUMS_FILE="$RELEASE_DIR/checksums-${{ matrix.name }}.txt"
          echo "# SHA-256 checksums for OpenPi ${{ github.ref_name }} (${{ matrix.name }})" > "$CHECKSUMS_FILE"
          echo "# Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$CHECKSUMS_FILE"
          echo "" >> "$CHECKSUMS_FILE"

          find "$RELEASE_DIR" -maxdepth 1 \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.exe" \) \
            | sort | while IFS= read -r f; do
            if command -v sha256sum &>/dev/null; then
              sha256sum "$f" | sed "s|$RELEASE_DIR/||" >> "$CHECKSUMS_FILE"
            elif command -v shasum &>/dev/null; then
              shasum -a 256 "$f" | sed "s|$RELEASE_DIR/||" >> "$CHECKSUMS_FILE"
            fi
          done

          echo "=== Checksums ==="
          cat "$CHECKSUMS_FILE"

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: openpi-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            release/${{ steps.release_meta.outputs.version }}/OpenPi-${{ steps.release_meta.outputs.version }}-${{ matrix.artifactArch }}.*
            release/${{ steps.release_meta.outputs.version }}/latest*.yml
            release/${{ steps.release_meta.outputs.version }}/checksums-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Detect Homebrew tap credentials
        id: brew_status
        env:
          BREW_TAP_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
        run: |
          if [ -n "$BREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes from changelog
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" release-notes.generated.md

      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate combined macOS update metadata
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node scripts/updateMetadata.mjs "$VERSION" dist-artifacts

      - name: Merge platform checksums into combined checksums.txt
        run: |
          COMBINED="dist-artifacts/checksums.txt"
          echo "# SHA-256 checksums for OpenPi ${{ github.ref_name }}" > "$COMBINED"
          echo "# Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$COMBINED"
          echo "" >> "$COMBINED"
          for f in dist-artifacts/checksums-*.txt; do
            [ -f "$f" ] || continue
            echo "## $(basename "$f")" >> "$COMBINED"
            grep -v '^#' "$f" >> "$COMBINED" || true
            echo "" >> "$COMBINED"
          done
          echo "=== Combined checksums.txt ==="
          cat "$COMBINED"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: OpenPi ${{ github.ref_name }}
          body_path: release-notes.generated.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/**

      - name: Update Homebrew tap
        if: ${{ steps.brew_status.outputs.enabled == 'true' }}
        env:
          BREW_TAP_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
        run: |
          ARM64_DMG=$(find dist-artifacts -name "*-arm64.dmg" | head -1)
          X64_DMG=$(find dist-artifacts -name "*-x64.dmg" | head -1)
          if [ -z "$ARM64_DMG" ] || [ -z "$X64_DMG" ]; then
            echo "Missing arm64 or x64 macOS DMG — refusing to update the Homebrew tap"
            exit 1
          fi
          echo "Updating Homebrew tap with $ARM64_DMG and $X64_DMG"
          node scripts/update-brew.mjs "${{ github.ref_name }}" "$ARM64_DMG" "$X64_DMG"

      - name: Verify Homebrew tap reflects both macOS architectures
        if: ${{ steps.brew_status.outputs.enabled == 'true' }}
        env:
          BREW_TAP_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Verifying tap has both macOS installers for $VERSION..."
          TAP_CONTENT=$(curl -sL \
            -H "Authorization: Bearer $BREW_TAP_TOKEN" \
            "https://api.github.com/repos/heyhuynhgiabuu/homebrew-openpi/contents/Casks/openpi.rb" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())")
          for expected in "version \"$VERSION\"" "OpenPi-#{version}-arm64.dmg" "OpenPi-#{version}-x64.dmg"; do
            case "$TAP_CONTENT" in
              *"$expected"*) ;;
              *)
                echo "::error::Homebrew tap is missing: $expected"
                exit 1
                ;;
            esac
          done
          echo "✓ Homebrew tap correctly reflects both macOS architectures"
